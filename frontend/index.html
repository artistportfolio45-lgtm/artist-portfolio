<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Original artworks and selected works from the artist's studio." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Artist Portfolio" />
    <meta property="og:description" content="Original artworks and selected works from the artist's studio." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Artist Portfolio</title>
    <!-- Apply a validated cached theme synchronously before CSS and React paint. -->
    <script src="/theme-bootstrap.js"></script>
    <!-- Start the image CDN connection before React discovers artwork images. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <!-- Cormorant Garamond (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Static forms used by Netlify form detection -->
    <div hidden>
      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
        <input type="text" name="inquiryType" />
        <input type="text" name="sourcePage" />
        <input type="text" name="artworkId" />
        <input type="text" name="artworkTitle" />
        <input type="text" name="artworkUrl" />
      </form>

      <form name="artwork-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="artwork-inquiry" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <textarea name="message"></textarea>
        <input type="text" name="inquiryType" />
        <input type="text" name="sourcePage" />
        <input type="text" name="artworkId" />
        <input type="text" name="artworkTitle" />
        <input type="text" name="artworkUrl" />
        <input type="text" name="artworkImage" />
      </form>
    </div>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--theme-bg);color:var(--theme-text);font-family:Arial,sans-serif;padding:24px;text-align:center;">
        <div>
          <h1 style="font-size:32px;font-weight:400;margin:0 0 12px;">Artist Portfolio</h1>
          <p style="margin:0;color:var(--theme-muted);">Loading website...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
